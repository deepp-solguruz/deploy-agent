name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'
  JWT_SECRET: 'test-jwt-secret-for-ci-pipeline'
  JWT_EXPIRES_IN: '1h'

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: |
        # Add linting when eslint is configured
        echo "Linting step - add eslint configuration"
        
    - name: Run unit tests
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: npm test -- --testPathPattern="tests/unit"
      
    - name: Run integration tests
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: npm test -- --testPathPattern="tests/integration"
      
    - name: Generate test coverage
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: npm test -- --coverage --watchAll=false
      
    - name: Upload coverage to Codecov
      if: matrix.node-version == '18.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        
  auth-tests:
    name: Authentication Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run auth middleware tests
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: npm test -- --testPathPattern="auth.test.js"
      
    - name: Test JWT token operations
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: npm test -- --testPathPattern="middleware/auth.test.js"
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=high
      
    - name: Check for vulnerable dependencies
      run: |
        # Check bcrypt and jsonwebtoken specifically
        npm ls bcrypt jsonwebtoken
        
    - name: Run dependency check
      run: |
        npx audit-ci --config .audit-ci.json || echo "Audit completed with warnings"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, auth-tests, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --only=production
      
    - name: Create production build
      run: |
        mkdir -p dist
        cp -r src dist/
        cp package.json dist/
        cp package-lock.json dist/
        
    - name: Test production build
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: |
        cd dist
        npm ci --only=production
        timeout 10s node src/server.js || true
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: production-build
        path: dist/
        retention-days: 7

  health-check:
    name: Health Check Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start server in background
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: |
        npm start &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        
    - name: Wait for server to start
      run: |
        timeout 30s bash -c 'until curl -f http://localhost:3000/api/health; do sleep 1; done'
        
    - name: Test health endpoints
      run: |
        # Test basic health check
        curl -f http://localhost:3000/api/health
        
        # Test detailed health check
        curl -f http://localhost:3000/api/health/detailed
        
        # Test readiness probe
        curl -f http://localhost:3000/api/health/ready
        
        # Test liveness probe
        curl -f http://localhost:3000/api/health/live
        
        # Test root endpoint
        curl -f http://localhost:3000/
        
    - name: Stop server
      if: always()
      run: |
        if [ ! -z "$SERVER_PID" ]; then
          kill $SERVER_PID || true
        fi

  auth-integration:
    name: Auth Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start server in background
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
      run: |
        npm start &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        
    - name: Wait for server to start
      run: |
        timeout 30s bash -c 'until curl -f http://localhost:3000/api/health; do sleep 1; done'
        
    - name: Test auth endpoints
      run: |
        # Test user registration
        REGISTER_RESPONSE=$(curl -s -X POST http://localhost:3000/api/auth/register \
          -H "Content-Type: application/json" \
          -d '{"username":"testuser","email":"test@example.com","password":"testpass123"}')
        echo "Register response: $REGISTER_RESPONSE"
        
        # Extract token from registration response
        TOKEN=$(echo $REGISTER_RESPONSE | grep -o '"token":"[^"]*' | cut -d'"' -f4)
        echo "Extracted token: $TOKEN"
        
        # Test login
        LOGIN_RESPONSE=$(curl -s -X POST http://localhost:3000/api/auth/login \
          -H "Content-Type: application/json" \
          -d '{"username":"testuser","password":"testpass123"}')
        echo "Login response: $LOGIN_RESPONSE"
        
        # Test protected profile endpoint
        PROFILE_RESPONSE=$(curl -s -X GET http://localhost:3000/api/auth/profile \
          -H "Authorization: Bearer $TOKEN")
        echo "Profile response: $PROFILE_RESPONSE"
        
        # Test token refresh
        REFRESH_RESPONSE=$(curl -s -X POST http://localhost:3000/api/auth/refresh \
          -H "Authorization: Bearer $TOKEN")
        echo "Refresh response: $REFRESH_RESPONSE"
        
    - name: Stop server
      if: always()
      run: |
        if [ ! -z "$SERVER_PID" ]; then
          kill $SERVER_PID || true
        fi

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [test, auth-tests, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Create Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM node:18-alpine
        
        WORKDIR /app
        
        # Copy package files
        COPY package*.json ./
        
        # Install dependencies
        RUN npm ci --only=production && npm cache clean --force
        
        # Copy source code
        COPY src/ ./src/
        
        # Create non-root user
        RUN addgroup -g 1001 -S nodejs && \
            adduser -S nodejs -u 1001
        
        # Change ownership
        RUN chown -R nodejs:nodejs /app
        USER nodejs
        
        # Expose port
        EXPOSE 3000
        
        # Health check
        HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
          CMD curl -f http://localhost:3000/api/health || exit 1
        
        # Start application
        CMD ["npm", "start"]
        EOF
        
    - name: Build Docker image
      run: |
        docker build -t deploy-agent:${{ github.sha }} .
        docker build -t deploy-agent:latest .
        
    - name: Test Docker image
      run: |
        # Start container with auth environment
        docker run -d --name test-container -p 3000:3000 \
          -e JWT_SECRET="${{ env.JWT_SECRET }}" \
          -e JWT_EXPIRES_IN="${{ env.JWT_EXPIRES_IN }}" \
          deploy-agent:${{ github.sha }}
        
        # Wait for container to be ready
        sleep 15
        
        # Test health endpoint
        curl -f http://localhost:3000/api/health
        
        # Test auth registration
        curl -X POST http://localhost:3000/api/auth/register \
          -H "Content-Type: application/json" \
          -d '{"username":"dockertest","email":"docker@test.com","password":"dockerpass123"}'
        
        # Check container health
        docker ps --filter "name=test-container"
        
        # Stop and remove container
        docker stop test-container
        docker rm test-container

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, auth-tests, security, build, health-check, auth-integration]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.test.result == 'success' && needs.auth-tests.result == 'success' && needs.security.result == 'success' && needs.build.result == 'success' && needs.health-check.result == 'success' && needs.auth-integration.result == 'success' }}
      run: |
        echo "✅ All CI checks passed successfully!"
        echo "- Tests: ${{ needs.test.result }}"
        echo "- Auth Tests: ${{ needs.auth-tests.result }}"
        echo "- Security: ${{ needs.security.result }}"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Health Check: ${{ needs.health-check.result }}"
        echo "- Auth Integration: ${{ needs.auth-integration.result }}"
        
    - name: Notify failure
      if: ${{ needs.test.result == 'failure' || needs.auth-tests.result == 'failure' || needs.security.result == 'failure' || needs.build.result == 'failure' || needs.health-check.result == 'failure' || needs.auth-integration.result == 'failure' }}
      run: |
        echo "❌ CI pipeline failed!"
        echo "- Tests: ${{ needs.test.result }}"
        echo "- Auth Tests: ${{ needs.auth-tests.result }}"
        echo "- Security: ${{ needs.security.result }}"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Health Check: ${{ needs.health-check.result }}"
        echo "- Auth Integration: ${{ needs.auth-integration.result }}"
        exit 1