name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: |
        # Add linting when eslint is configured
        echo "Linting step - add eslint configuration"
        
    - name: Run tests
      run: npm test
      
    - name: Generate test coverage
      run: npm run test -- --coverage --watchAll=false
      
    - name: Upload coverage to Codecov
      if: matrix.node-version == '18.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=high
      
    - name: Run dependency check
      run: |
        npx audit-ci --config .audit-ci.json || echo "Audit completed with warnings"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --only=production
      
    - name: Create production build
      run: |
        mkdir -p dist
        cp -r src dist/
        cp package.json dist/
        cp package-lock.json dist/
        
    - name: Test production build
      run: |
        cd dist
        npm ci --only=production
        timeout 10s node src/server.js || true
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: production-build
        path: dist/
        retention-days: 7

  health-check:
    name: Health Check Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start server in background
      run: |
        npm start &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        
    - name: Wait for server to start
      run: |
        timeout 30s bash -c 'until curl -f http://localhost:3000/api/health; do sleep 1; done'
        
    - name: Test health endpoints
      run: |
        # Test basic health check
        curl -f http://localhost:3000/api/health
        
        # Test detailed health check
        curl -f http://localhost:3000/api/health/detailed
        
        # Test readiness probe
        curl -f http://localhost:3000/api/health/ready
        
        # Test liveness probe
        curl -f http://localhost:3000/api/health/live
        
        # Test root endpoint
        curl -f http://localhost:3000/
        
    - name: Stop server
      if: always()
      run: |
        if [ ! -z "$SERVER_PID" ]; then
          kill $SERVER_PID || true
        fi

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Create Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM node:18-alpine
        
        WORKDIR /app
        
        # Copy package files
        COPY package*.json ./
        
        # Install dependencies
        RUN npm ci --only=production && npm cache clean --force
        
        # Copy source code
        COPY src/ ./src/
        
        # Create non-root user
        RUN addgroup -g 1001 -S nodejs && \
            adduser -S nodejs -u 1001
        
        # Change ownership
        RUN chown -R nodejs:nodejs /app
        USER nodejs
        
        # Expose port
        EXPOSE 3000
        
        # Health check
        HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
          CMD curl -f http://localhost:3000/api/health || exit 1
        
        # Start application
        CMD ["npm", "start"]
        EOF
        
    - name: Build Docker image
      run: |
        docker build -t deploy-agent:${{ github.sha }} .
        docker build -t deploy-agent:latest .
        
    - name: Test Docker image
      run: |
        # Start container
        docker run -d --name test-container -p 3000:3000 deploy-agent:${{ github.sha }}
        
        # Wait for container to be ready
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:3000/api/health
        
        # Check container health
        docker ps --filter "name=test-container"
        
        # Stop and remove container
        docker stop test-container
        docker rm test-container

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, security, build, health-check]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.test.result == 'success' && needs.security.result == 'success' && needs.build.result == 'success' && needs.health-check.result == 'success' }}
      run: |
        echo "✅ All CI checks passed successfully!"
        echo "- Tests: ${{ needs.test.result }}"
        echo "- Security: ${{ needs.security.result }}"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Health Check: ${{ needs.health-check.result }}"
        
    - name: Notify failure
      if: ${{ needs.test.result == 'failure' || needs.security.result == 'failure' || needs.build.result == 'failure' || needs.health-check.result == 'failure' }}
      run: |
        echo "❌ CI pipeline failed!"
        echo "- Tests: ${{ needs.test.result }}"
        echo "- Security: ${{ needs.security.result }}"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Health Check: ${{ needs.health-check.result }}"
        exit 1